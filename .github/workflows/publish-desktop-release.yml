name: Publish Luma releases
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
concurrency:
  group: luma-release
  cancel-in-progress: false
jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set app version from release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Install dependencies
        run: npm install
      - name: Validate app syntax and configuration
        run: npm run test:syntax
      - name: Publish Windows installer and updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish always

  android-release:
    if: ${{ vars.LUMA_ANDROID_RELEASE_ENABLED == 'true' }}
    needs: windows-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Set app version from release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Create and sync Android project
        run: |
          npx cap add android
          npm run android:sync
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("android/app/build.gradle")
          source = p.read_text()
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          code = os.environ["GITHUB_RUN_NUMBER"]
          source, count = re.subn(r'versionName\s+"[^"]+"', 'versionName "' + version + '"', source, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionName from release tag")
          source, count = re.subn(r'versionCode\s+\d+', 'versionCode ' + code, source, count=1)
          if count != 1:
              raise SystemExit("Could not set monotonically increasing Android versionCode")
          p.write_text(source)
          PY
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luma-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/luma-release.keystore" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          source = p.read_text()
          signing = """signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              """
          if "signingConfigs {" not in source:
              source, count = re.subn(r"(\s*)buildTypes\s*\{", lambda m: m.group(1) + signing + m.group(1) + "buildTypes {", source, count=1)
              if count != 1:
                  raise SystemExit("Could not locate Android buildTypes block for release signing")
          source, count = re.subn(r"(buildTypes\s*\{\s*release\s*\{)", r"\1\n            signingConfig signingConfigs.release", source, count=1)
          if count != 1:
              raise SystemExit("Could not configure release signing")
          p.write_text(source)
          PY
      - name: Build signed Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Upload Android APK to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/app-release.apk --clobber
