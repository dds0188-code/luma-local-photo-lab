name: Build Luma installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate app syntax and configuration
        run: npm run test:syntax
      - name: Build Windows installer
        run: npm run dist:win -- --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Validate app syntax and configuration
        run: npm run test:syntax
      - name: Create Android project
        run: npx cap add android
      - name: Build shared app and sync Android
        run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
