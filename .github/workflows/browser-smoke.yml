name: Browser smoke tests
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
concurrency:
  group: browser-smoke
  cancel-in-progress: true
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local app server
        run: npx --yes http-server . -p 4173 -c-1 > /tmp/luma-server.log 2>&1 &
      - name: Run browser tests against checked-out source
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npx playwright test tests/browser-smoke.spec.cjs --reporter=line
